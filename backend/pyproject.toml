[project]
name = "travel-plan-backend"
version = "0.1.0"
description = "旅梦规划助手后端"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    "python-dotenv>=1.0.1",
    "reportlab>=5.1.0",
]

[dependency-groups]
dev = ["pytest>=8.3.0", "httpx>=0.28.0"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

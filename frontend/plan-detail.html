<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>计划详情 · 旅梦规划助手</title>
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/plan-content.css" />
<link rel="stylesheet" href="css/plans.css" />
<script src="js/auth.js"></script>
<script>
  // 全局路由守卫：未登录访问自动跳转登录页（详情 PRD §1）
  requireAuth();
</script>
</head>
<body>

<!-- 本页图标（顶部栏图标由 layout.js 注入） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="ic-map" viewBox="0 0 24 24"><path d="M3 6.5l6-2.5 6 2.5 6-2.5v13l-6 2.5-6-2.5-6 2.5v-13z"/><path d="M9 4v13M15 6.5v13"/></symbol>

  <symbol id="ic-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 9.8h17M8 3v4M16 3v4"/><path d="M8 13.5h3M8 17h6"/></symbol>
  <symbol id="ic-users" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3"/><path d="M3.5 19c.5-3.2 2.8-5 5.5-5s5 1.8 5.5 5"/><path d="M16 6.2a3 3 0 0 1 0 5.6M17 14.4c2 .6 3.3 2.2 3.7 4.6"/></symbol>

  <symbol id="ic-sparkles" viewBox="0 0 24 24"><path d="M12 3l1.7 4.6L18.3 9.3l-4.6 1.7L12 15.6l-1.7-4.6-4.6-1.7 4.6-1.7L12 3z"/><path d="M19 15.5l.7 1.9 1.9.7-1.9.7-.7 1.9-.7-1.9-1.9-.7 1.9-.7.7-1.9z"/></symbol>
  <symbol id="ic-bus" viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="14" rx="2"/><path d="M4 11h16M7 17.5V20M17 17.5V20"/><circle cx="8" cy="14.5" r="1"/><circle cx="16" cy="14.5" r="1"/></symbol>

  <symbol id="ic-hotel" viewBox="0 0 24 24"><path d="M3 20V9l9-5 9 5v11"/><path d="M2.5 20h19"/><path d="M9.5 20v-6h5v6"/><path d="M9 9h.01M15 9h.01"/></symbol>
  <symbol id="ic-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
  <symbol id="ic-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></symbol>
  <symbol id="ic-alert" viewBox="0 0 24 24"><path d="M12 3.5L2.5 20h19L12 3.5z"/><path d="M12 10v4M12 17h.01"/></symbol>
  <symbol id="ic-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
  <symbol id="ic-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>

  <symbol id="ic-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13h10l1-13M10 11v6M14 11v6"/></symbol>
  <symbol id="ic-download" viewBox="0 0 24 24"><path d="M12 3v12M8 11l4 4 4-4M4 19h16"/></symbol>
  <symbol id="ic-chev-left" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
  <symbol id="ic-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="ic-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
</defs></svg>

<main class="page page--wide">
  <div class="page-head">
    <div>
      <button type="button" class="back-link" id="btn-back">
        <svg class="icon icon--sm"><use href="#ic-chev-left"/></svg>返回我的旅行计划
      </button>
      <h1 id="detail-title">计划详情</h1>
      <p class="saved-time" id="detail-saved"></p>
    </div>
    <div class="head-actions" id="detail-actions" hidden>
      <button type="button" class="btn btn--ghost" id="btn-supplement">
        <svg class="icon icon--sm"><use href="#ic-plus"/></svg>补充攻略
      </button>
      <button type="button" class="btn btn--ghost" id="btn-copy">
        <svg class="icon icon--sm"><use href="#ic-copy"/></svg>复制
      </button>
      <button type="button" class="btn btn--soft" id="btn-export">
        <svg class="icon icon--sm"><use href="#ic-download"/></svg>导出 PDF
      </button>
      <button type="button" class="btn btn--ghost btn--text-danger" id="btn-delete">
        <svg class="icon icon--sm"><use href="#ic-trash"/></svg>删除
      </button>
    </div>
    <div class="head-actions" id="optimized-actions" hidden>
      <button type="button" class="btn btn--primary" id="btn-save-optimized">保存为新计划</button>
      <button type="button" class="btn btn--ghost" id="btn-discard">返回原计划</button>
    </div>
  </div>

  <div id="detail-body"></div>
</main>

<!-- 优化生成中遮罩 -->
<div class="loading-mask" id="loading-mask" hidden>
  <div class="loading-box">
    <div class="spinner"></div>
    <h3>AI 正在优化你的行程…</h3>
    <p>已补充参考攻略，正在重新规划，通常需要 30–60 秒，请稍候</p>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/plan-render.js"></script>
<script>
/* ==========================================================================
   我的旅行计划 · 详情页
   依据：需求文档/我的旅行计划-PRD.md v1.3、开发文档/接口文档.md v1.0
   ========================================================================== */

const $ = (id) => document.getElementById(id);

const planId = Number(new URLSearchParams(location.search).get('id'));
const state = { record: null, activeDay: 0, optimizing: false, optimized: null };

mountTopbar();
setTopbarUser(getUsername());

$('btn-back').addEventListener('click', () => {
  location.href = 'plans.html';
});

/* ---------- 加载 ---------- */
async function loadDetail() {
  if (!Number.isInteger(planId) || planId <= 0) {
    renderState('无法打开该计划', '链接参数不正确，请从列表进入。');
    return;
  }

  state.optimized = null;
  $('optimized-actions').hidden = true;
  $('detail-body').innerHTML = `<div class="skeleton-list">
    <div class="skeleton-row"></div>
    <div class="skeleton-row"></div>
    <div class="skeleton-row"></div>
  </div>`;
  $('detail-actions').hidden = true;

  const result = await apiRequest(`/api/plans/${planId}`);

  if (result.code === 0) {
    state.record = result.data;
    state.activeDay = 0;
    renderDetail();
    return;
  }

  if (result.code === 403) {
    toast('无权访问');
    setTimeout(() => { location.href = 'plans.html'; }, 800);
    return;
  }

  if (result.code === 404) {
    renderState('计划不存在', '该计划可能已被删除。');
    return;
  }

  renderState('加载失败', result.message || '加载失败，请重试', true);
}

/* ---------- 渲染 ---------- */
function renderDetail() {
  const record = state.record;

  $('detail-title').textContent = record.title;
  $('detail-saved').innerHTML =
    `<svg class="icon icon--sm"><use href="#ic-clock"/></svg>保存于 ${formatDateTime(record.created_at)}`;
  $('detail-actions').hidden = false;
  $('optimized-actions').hidden = true;
  $('detail-body').innerHTML = PlanRender.render(record.plan_content, record, state.activeDay);
}

/** 渲染「补充攻略后」的新方案（未保存） */
function renderOptimized() {
  const record = state.record;
  const optimized = state.optimized;
  if (!record || !optimized) return;

  $('detail-title').textContent = optimized.title || '优化后的方案';
  $('detail-saved').innerHTML =
    '<svg class="icon icon--sm"><use href="#ic-info"/></svg>优化结果（未保存）· 可保存为新计划';
  $('detail-actions').hidden = true;
  $('optimized-actions').hidden = false;

  $('detail-body').innerHTML = PlanRender.render(
    optimized.plan_content,
    { ...record, used_guide: optimized.used_guide },
    state.activeDay
  );
}

function renderState(title, message, retry = false) {
  $('detail-title').textContent = title;
  $('detail-saved').textContent = '';
  $('detail-actions').hidden = true;
  $('optimized-actions').hidden = true;

  $('detail-body').innerHTML = `<div class="card detail-state">
    <p>${PlanRender.esc(message)}</p>
    <div class="head-actions" style="justify-content:center">
      ${retry ? '<button type="button" class="btn btn--primary" id="btn-retry">重试</button>' : ''}
      <a class="btn btn--ghost" href="plans.html">返回我的旅行计划</a>
    </div>
  </div>`;

  if (retry) {
    $('btn-retry').addEventListener('click', loadDetail);
  }
}

/* ---------- 每日切换（事件委托，重渲染后依然有效） ---------- */
$('detail-body').addEventListener('click', (event) => {
  const tab = event.target.closest('[data-day]');
  if (!tab || !state.record) return;

  state.activeDay = Number(tab.dataset.day);

  if (state.optimized) {
    renderOptimized();
    return;
  }

  $('detail-body').innerHTML = PlanRender.render(
    state.record.plan_content,
    state.record,
    state.activeDay
  );
});

/* ---------- 复制 ---------- */
$('btn-copy').addEventListener('click', async () => {
  if (!state.record) return;

  const text = PlanRender.buildCopyText(state.record.plan_content, state.record);
  const ok = await copyText(text);
  toast(ok ? '已复制' : '复制失败，请重试');
});

/* ---------- 导出 PDF ---------- */
$('btn-export').addEventListener('click', async () => {
  const button = $('btn-export');
  button.disabled = true;

  const result = await apiDownload(`/api/plans/${planId}/pdf`);

  button.disabled = false;

  if (result.ok) {
    saveBlob(result.blob, result.filename);
    toast('导出成功');
  } else {
    toast(result.message);
  }
});

/* ---------- 删除 ---------- */
$('btn-delete').addEventListener('click', async () => {
  const confirmed = await showConfirm({
    title: '确定删除该计划吗？',
    message: '删除后不可恢复，该行程将从你的计划列表中永久移除。',
    okText: '确定删除',
    danger: true,
  });
  if (!confirmed) return;

  const result = await apiRequest(`/api/plans/${planId}`, { method: 'DELETE' });

  if (result.code === 0) {
    toast('已删除');
    setTimeout(() => { location.href = 'plans.html'; }, 500);
  } else {
    toast(result.message || '删除失败，请重试');
  }
});

/* ---------- 补充攻略优化（生成 PRD §3.6 / v1.8） ---------- */
async function optimizeWithGuides(newGuides) {
  if (state.optimizing || !state.record) return;

  state.optimizing = true;
  $('loading-mask').hidden = false;

  const record = state.record;
  // 原有链接来源可继续带上；原始粘贴正文未存档（数据库设计 §6.2），无法恢复
  const linkSources = (record.guide_sources || [])
    .filter((source) => source && source.type === 'link' && source.url)
    .map((source) => ({ type: 'link', content: source.url }));

  const result = await apiRequest('/api/plans/generate', {
    method: 'POST',
    body: {
      departure: record.departure || '',
      destination: record.destination,
      days: record.days,
      start_date: record.start_date,
      budget_per_person: record.budget_per_person,
      people: record.people,
      interest_tags: record.interest_tags || [],
      pace: record.pace,
      transport_pref: record.transport_pref,
      hotel_pref: record.hotel_pref,
      special_needs: record.special_needs,
      guides: [...linkSources, ...newGuides].slice(0, 3),
    },
    timeout: 130000,
  });

  state.optimizing = false;
  $('loading-mask').hidden = true;

  if (result.code === 0 && result.data) {
    state.optimized = { ...result.data, guides: newGuides };
    state.activeDay = 0;
    renderOptimized();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  toast(result.message || '生成失败，请重试');
}

$('btn-supplement').addEventListener('click', async () => {
  if (!state.record || state.optimizing) return;

  if (!state.record.departure) {
    toast('该计划缺少出发地信息，请到生成页重新创建后再优化');
    return;
  }

  const guides = await openGuideDialog({
    title: '补充参考攻略优化',
    description: '将基于该计划的出行条件重新生成一版方案。原有攻略正文未存档无法恢复，可补充新的链接或文本。',
  });
  if (!guides) return;

  await optimizeWithGuides(guides);
});

$('btn-discard').addEventListener('click', () => {
  state.optimized = null;
  loadDetail();
});

$('btn-save-optimized').addEventListener('click', async () => {
  const record = state.record;
  const optimized = state.optimized;
  if (!record || !optimized) return;

  const button = $('btn-save-optimized');
  button.disabled = true;

  const result = await apiRequest('/api/plans', {
    method: 'POST',
    body: {
      departure: record.departure,
      destination: record.destination,
      days: record.days,
      start_date: record.start_date,
      budget_per_person: record.budget_per_person,
      people: record.people,
      interest_tags: record.interest_tags || [],
      pace: record.pace,
      transport_pref: record.transport_pref,
      hotel_pref: record.hotel_pref,
      special_needs: record.special_needs,
      used_guide: !!optimized.used_guide,
      guide_sources: optimized.guides.map((guide) => (
        guide.type === 'link'
          ? { type: 'link', url: guide.content, label: '分享链接' }
          : { type: 'text', url: null, label: '用户粘贴的攻略正文' }
      )),
      plan_content: optimized.plan_content,
    },
  });

  button.disabled = false;

  if (result.code === 0) {
    toast('已保存');
    setTimeout(() => { location.href = `plan-detail.html?id=${result.data.id}`; }, 400);
  } else {
    toast(result.message || '保存失败，请重试');
  }
});

/* ---------- 初始化 ---------- */
loadDetail();
</script>
</body>
</html>
